[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-hybrid-rag"
version = "1.0.0"
description = "Enterprise Hybrid Search & Document Intelligence Engine (Dense + BM25 + Cross-Encoder + Redis Semantic Cache)"
authors = [{ name = "Keshav Budhiraja" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "requests>=2.31.0",
]

[project.scripts]
synapse = "src.cli:main"
