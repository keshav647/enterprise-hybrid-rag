<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="synapseBg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131324"/>
      <stop offset="50%" stop-color="#0b0b12"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="synapseIndigo" x1="20" y1="18" x2="100" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="synapseCyan" x1="24" y1="96" x2="96" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="synapseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Double-Bezel Squircle Base -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#synapseBg)" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
  <rect x="10" y="10" width="100" height="100" rx="22" fill="none" stroke="rgba(99,102,241,0.28)" stroke-width="1"/>

  <!-- Isometric Hybrid Lattice (Dense Vector + BM25 Lexical Convergence) -->
  <g filter="url(#synapseGlow)">
    <!-- Top Dimensional Prism -->
    <polygon points="60,20 94,39 60,58 26,39" fill="rgba(99,102,241,0.18)" stroke="url(#synapseIndigo)" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- Middle RRF Fusion Layer -->
    <polyline points="26,60 60,79 94,60" fill="none" stroke="url(#synapseCyan)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Grounded Verification Layer -->
    <polyline points="26,80 60,99 94,80" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  </g>

  <!-- Central Neural Axis & Nodes -->
  <line x1="60" y1="39" x2="60" y2="99" stroke="url(#synapseCyan)" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="60" cy="39" r="5" fill="#ffffff"/>
  <circle cx="26" cy="60" r="4" fill="#06b6d4"/>
  <circle cx="94" cy="60" r="4" fill="#6366f1"/>
  <circle cx="60" cy="79" r="4.5" fill="#22d3ee"/>
  <circle cx="60" cy="99" r="4" fill="#ffffff"/>
</svg>
